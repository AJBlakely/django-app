{% extends 'base.html' %}

{% block content %}
<h1>All Books</h1>
<a href="{% url 'book-create' %}">Add a Book</a>
{% for book in books %}
  <div>
    <h2><a href="{% url 'book-detail' book.id %}">{{ book.title }}</a></h2>
    <p>{{ book.author }} — {{ book.year_published }}</p>
  </div>
{% empty %}
  <p>No books yet.</p>
{% endfor %}
{% endblock %}
