{% extends 'base.html' %}

{% block content %}
<h1>Delete "{{ book.title }}"?</h1>
<p>This action cannot be undone.</p>
<form method="POST">
  {% csrf_token %}
  <button type="submit" class="btn btn-delete">Yes, Delete</button>
  <a href="{% url 'book-detail' book.id %}" class="btn btn-cancel">Cancel</a>
</form>
{% endblock %}
